<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Use Cases</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --border: #e3e3df; --accent: #c96442; --chip: #eeeee9; --chip-on: #c96442;
    --gold: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #212125; --text: #ececec; --muted: #9a9aa2;
      --border: #333338; --accent: #e08b64; --chip: #2b2b30; --chip-on: #e08b64;
      --gold: #d4a53a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { margin: 0 0 4px; font-size: 1.7rem; }
  .sub { color: var(--muted); margin-bottom: 24px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
  .chip { border: 1px solid var(--border); background: var(--chip); color: var(--text);
          border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: .88rem; }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  select { margin-left: auto; background: var(--card); color: var(--text);
           border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: .88rem; }
  h2 { font-size: 1.05rem; color: var(--muted); text-transform: uppercase;
       letter-spacing: .06em; margin: 28px 0 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 12px; }
  .card.top { border-left: 3px solid var(--gold); }
  .rank { color: var(--gold); font-weight: 700; margin-right: 6px; }
  .card h3 { margin: 0 0 6px; font-size: 1.05rem; }
  .card p { margin: 0 0 8px; color: var(--text); font-size: .93rem; }
  .example { color: var(--muted); font-style: italic; font-size: .88rem; margin-bottom: 8px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { font-size: .78rem; background: var(--chip); border-radius: 6px; padding: 2px 8px; }
  .meta { font-size: .8rem; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Claude Code Use Cases</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="controls" id="chips">
    <button class="chip on" data-key="all">All</button>
    <button class="chip" data-key="creative">🎨 Creative</button>
    <button class="chip" data-key="useful">✅ Useful</button>
    <button class="chip" data-key="fun">🎉 Fun</button>
    <button class="chip" data-key="painPoint">🩹 Pain point</button>
    <button class="chip" data-key="money">💰 Money</button>
    <select id="sort">
      <option value="score">Sort: score</option>
      <option value="newest">Sort: newest</option>
    </select>
  </div>
  <div id="top5"></div>
  <div id="list"></div>
</div>
<script>
const BADGES = {creative:"🎨 creative", useful:"✅ useful", fun:"🎉 fun",
                painPoint:"🩹 pain point", money:"💰 money"};
let all = [], filter = "all", sortBy = "score";

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(u, rank) {
  const badges = Object.keys(BADGES).filter(k => u.criteria[k])
    .map(k => `<span class="badge">${BADGES[k]}</span>`).join("");
  const sources = u.sources.map(s =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(" · ");
  return `<div class="card${rank ? " top" : ""}">
    <h3>${rank ? `<span class="rank">#${rank}</span>` : ""}${esc(u.title)}</h3>
    <p>${esc(u.summary)}</p>
    ${u.example ? `<div class="example">e.g. ${esc(u.example)}</div>` : ""}
    <div class="badges">${badges}</div>
    <div class="meta">score ${u.score} · ${esc(u.week)} · ${sources}</div>
  </div>`;
}

function render() {
  const latest = all.length ? all.map(u => u.week).sort().at(-1) : "";
  const top5 = all.filter(u => u.week === latest)
    .sort((a, b) => b.score - a.score || a.title.localeCompare(b.title)).slice(0, 5);
  document.getElementById("top5").innerHTML = top5.length
    ? `<h2>This week's top 5 (${esc(latest)})</h2>` + top5.map((u, i) => card(u, i + 1)).join("")
    : "";

  let rest = all.filter(u => filter === "all" || u.criteria[filter]);
  rest = rest.sort((a, b) => sortBy === "score"
    ? b.score - a.score || b.added.localeCompare(a.added)
    : b.added.localeCompare(a.added) || b.score - a.score);
  document.getElementById("list").innerHTML =
    `<h2>All collected (${rest.length})</h2>` +
    (rest.length ? rest.map(u => card(u)).join("") : `<div class="empty">Nothing matches this filter.</div>`);
}

document.getElementById("chips").addEventListener("click", e => {
  if (!e.target.dataset.key) return;
  filter = e.target.dataset.key;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === e.target));
  render();
});
document.getElementById("sort").addEventListener("change", e => { sortBy = e.target.value; render(); });

fetch("data/usecases.json").then(r => r.json()).then(doc => {
  all = doc.usecases;
  document.getElementById("sub").textContent =
    `${all.length} use cases collected · updated ${doc.updated} · weekly top 5 goes to Telegram`;
  render();
}).catch(() => {
  document.getElementById("sub").textContent =
    "Could not load data/usecases.json — serve this folder with: python3 -m http.server 8124";
});
</script>
</body>
</html>
