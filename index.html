<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Personal Spellbooks</title>
<style>
  :root {
    --bg: #f3ede3; --text: #2b2118; --muted: #7d6f5f;
    --wood: #a9764a; --wood-dark: #7d5433; --wood-edge: #5e3d22;
    --panel: #fffdf8; --border: #e0d5c3; --accent: #c96442;
    --chip: #e9e0d1; --chip-on: #c96442; --spine-text: #f7f1e3;
    --shadow: rgba(60, 40, 20, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1712; --text: #eae2d4; --muted: #a39682;
      --wood: #6e4b2c; --wood-dark: #4c3016; --wood-edge: #33200e;
      --panel: #262019; --border: #3d3225; --accent: #e08b64;
      --chip: #322a1f; --chip-on: #e08b64; --spine-text: #f2ead8;
      --shadow: rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; font-family: Georgia, "Times New Roman", serif;
       letter-spacing: .01em; }
  .sub { color: var(--muted); margin-bottom: 20px; font-style: italic;
         font-family: Georgia, "Times New Roman", serif; }
  .sub a { color: var(--accent); text-decoration: none; }
  .sub a:hover { text-decoration: underline; }
  .about h4 { margin: 14px 0 4px; font-size: .95rem; }
  .about p, .about li { font-size: .9rem; margin: 0 0 6px; }
  .about ul { margin: 0; padding-left: 20px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip { border: 1px solid var(--border); background: var(--chip); color: var(--text);
          border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: .88rem; }
  .chip.on { background: var(--chip-on); border-color: var(--chip-on); color: #fff; }
  #search { flex: 1; min-width: 170px; border: 1px solid var(--border); background: var(--panel);
            color: var(--text); border-radius: 999px; padding: 5px 15px; font-size: .88rem; }
  #search:focus { outline: none; border-color: var(--accent); }

  /* Magic bookcase — candlelit alcoves of stacked tomes */
  .bookcase { position: relative; overflow: hidden; border-radius: 14px;
              border: 8px solid #170e06;
              background: radial-gradient(ellipse at 50% -10%, #52381e, #2a1b0d 62%, #20140a);
              padding: 18px 16px 16px;
              box-shadow: inset 0 0 46px rgba(0,0,0,.65), 0 14px 34px var(--shadow); }
  .case-title { text-align: center; color: #e8c87a; font-family: Georgia, "Times New Roman", serif;
                font-style: italic; font-size: .92rem; letter-spacing: .05em;
                margin: 0 0 16px; text-shadow: 0 0 12px rgba(232, 200, 122, .45); }
  .sparkle { position: absolute; color: #ffe9a8; pointer-events: none; opacity: 0;
             font-size: .8rem; animation: twinkle 3.6s ease-in-out infinite;
             text-shadow: 0 0 6px rgba(255, 233, 168, .9); }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.5); }
                       50% { opacity: .95; transform: scale(1.15); } }
  @media (prefers-reduced-motion: reduce) { .sparkle { animation: none; } }
  .alcoves { position: relative; display: grid; gap: 14px;
             grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .alcove { display: flex; flex-direction: column; border-radius: 8px;
            border: 2px solid #0e0802; background: linear-gradient(180deg, #221405, #150c04);
            padding: 12px 12px 0; box-shadow: inset 0 8px 22px rgba(0,0,0,.75); }
  .plaque { align-self: center; background: linear-gradient(180deg, #dcb768, #8a682d);
            color: #241804; font-size: .7rem; font-weight: 700; letter-spacing: .1em;
            text-transform: uppercase; padding: 3px 13px; border-radius: 4px;
            box-shadow: 0 1px 3px rgba(0,0,0,.7), inset 0 1px 1px rgba(255,255,255,.55);
            margin-bottom: 12px; white-space: nowrap; }
  .stack { display: flex; flex-direction: column-reverse; gap: 4px;
           min-height: 132px; margin-top: auto; justify-content: flex-start; }
  .tome { position: relative; border: none; cursor: pointer; display: flex;
          align-items: center; gap: 8px; padding: 0 12px 0 18px; text-align: left;
          color: #f3e3b8; font-family: Georgia, "Times New Roman", serif;
          border-radius: 4px 7px 7px 4px;
          box-shadow: 0 3px 6px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.2),
                      inset 0 -3px 4px rgba(0,0,0,.35);
          transition: transform .18s ease, box-shadow .18s ease; }
  .tome::before { content: ""; position: absolute; left: 6px; top: 5px; bottom: 5px;
                  width: 4px; border-radius: 2px; background: rgba(0,0,0,.3);
                  box-shadow: 0 1px 0 rgba(255,255,255,.15); }
  .tome:hover, .tome:focus-visible { outline: none; z-index: 2;
          transform: translateX(12px) rotate(0deg) !important;
          box-shadow: 0 0 16px rgba(232,200,122,.55), 0 3px 8px rgba(0,0,0,.5); }
  .tome .ttitle { font-size: .82rem; font-weight: 600; line-height: 1.18;
                  text-shadow: 0 1px 2px rgba(0,0,0,.75); overflow: hidden;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tome .ticons { margin-left: auto; flex-shrink: 0; font-size: .72rem; }
  .tome.gilded { border-right: 4px solid #e3c06a; }
  .tome.fresh { animation: glowpulse 3s ease-in-out infinite; }
  @keyframes glowpulse {
    0%, 100% { box-shadow: 0 3px 6px rgba(0,0,0,.55), 0 0 7px rgba(232,200,122,.3); }
    50% { box-shadow: 0 3px 6px rgba(0,0,0,.55), 0 0 19px rgba(232,200,122,.75); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tome.fresh { animation: none;
                  box-shadow: 0 3px 6px rgba(0,0,0,.55), 0 0 13px rgba(232,200,122,.55); }
  }
  .empty-stack { color: #8a7550; font-style: italic; font-size: .82rem;
                 text-align: center; padding: 16px 0 20px; }
  .shelf-lip { height: 10px; margin: 12px -12px 0; border-radius: 0 0 6px 6px;
               background: linear-gradient(#3b2712, #170e06); }

  /* Drawer cabinet */
  h2 { font-size: 1.05rem; color: var(--muted); text-transform: uppercase;
       letter-spacing: .06em; margin: 32px 0 12px; }
  .cabinet { background: linear-gradient(175deg, var(--wood), var(--wood-dark));
             border: 6px solid var(--wood-edge); border-radius: 10px; padding: 14px;
             box-shadow: 0 12px 30px var(--shadow); }
  .drawers { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  @media (max-width: 640px) { .drawers { grid-template-columns: repeat(3, 1fr); } }
  .drawer { border: none; cursor: pointer; border-radius: 6px; padding: 12px 6px 10px;
            background: linear-gradient(180deg, var(--wood-dark), var(--wood-edge));
            color: var(--spine-text); font-size: .85rem; font-weight: 600;
            box-shadow: inset 0 2px 3px rgba(255,255,255,.15), 0 3px 5px var(--shadow);
            transition: transform .15s ease; }
  .drawer:hover, .drawer:focus-visible { transform: translateY(2px); outline: none; }
  .drawer.open { transform: translateY(5px);
                 box-shadow: inset 0 3px 8px rgba(0,0,0,.5); }
  .drawer .handle { display: block; width: 26px; height: 5px; margin: 8px auto 0;
                    border-radius: 3px; background: #d8c9a3;
                    box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .drawer .count { opacity: .8; font-weight: 400; font-size: .75rem; display: block; }
  .drawer:disabled { opacity: .45; cursor: default; }
  .drawer:disabled:hover { transform: none; }

  .drawer-panel { background: var(--panel); border: 1px solid var(--border);
                  border-radius: 0 0 10px 10px; margin: 14px -14px -14px;
                  padding: 18px 20px; }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .panel-head strong { font-size: 1rem; }
  select { margin-left: auto; background: var(--panel); color: var(--text);
           border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px;
           font-size: .85rem; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
          padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 4px; font-size: .98rem; }
  .card p { margin: 0 0 6px; font-size: .9rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge { font-size: .75rem; background: var(--chip); border-radius: 6px; padding: 2px 8px; }
  .meta { font-size: .78rem; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }
  .empty { color: var(--muted); font-style: italic; }

  /* Book detail modal */
  .overlay { position: fixed; inset: 0; background: rgba(20, 12, 5, .55);
             display: none; align-items: center; justify-content: center; padding: 20px; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); color: var(--text); max-width: 560px; width: 100%;
           max-height: 82vh; overflow-y: auto; border-radius: 14px; padding: 24px 26px;
           border: 1px solid var(--border); box-shadow: 0 18px 50px var(--shadow); }
  .modal h3 { margin: 0 0 4px; font-size: 1.15rem; padding-right: 30px; }
  .modal .cat { color: var(--muted); font-size: .82rem; margin-bottom: 12px; }
  .modal .example { font-style: italic; color: var(--muted); font-size: .9rem; margin-bottom: 10px; }
  .recipe { background: var(--chip); border-left: 3px solid #d4af5f; border-radius: 0 8px 8px 0;
            padding: 10px 14px; margin: 12px 0; }
  .recipe .rhead { font-weight: 600; font-size: .88rem; margin-bottom: 6px; }
  .recipe .diff { background: #d4af5f; color: #2a1c08; border-radius: 999px; padding: 1px 9px;
                  font-size: .72rem; font-weight: 700; margin-left: 6px; }
  .recipe p { margin: 0 0 6px; font-size: .88rem; }
  .recipe .rtools { font-size: .8rem; color: var(--muted); }
  .libnote { background: var(--chip); border-left: 3px solid #d4af5f; border-radius: 0 8px 8px 0;
             padding: 10px 14px; margin-bottom: 12px; font-size: .9rem; font-style: italic; }
  .modal .close { position: absolute; } /* replaced by header button */
  .modal-top { position: relative; }
  .xbtn { position: absolute; top: -6px; right: -8px; border: none; background: none;
          color: var(--muted); font-size: 1.3rem; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🪄 Claude Code Personal Spellbooks</h1>
  <div class="sub"><span id="sub">Loading…</span> · <a href="#" id="aboutLink">📜 read me first</a></div>

  <div class="controls" id="chips">
    <button class="chip on" data-key="all">All</button>
    <button class="chip" data-key="creative">🎨 Creative</button>
    <button class="chip" data-key="useful">✅ Useful</button>
    <button class="chip" data-key="fun">🎉 Fun</button>
    <button class="chip" data-key="painPoint">🩹 Pain point</button>
    <button class="chip" data-key="money">💰 Saves money</button>
    <input id="search" type="search" placeholder="🔎 Search the spellbooks…" aria-label="Search spellbooks">
  </div>

  <div class="bookcase" id="bookcase"></div>

  <h2>🗄️ The month drawers — 2026</h2>
  <div class="cabinet">
    <div class="drawers" id="drawers"></div>
    <div id="panelSlot"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<script>
const CATEGORIES = ["Personal apps", "Life admin", "Money & budgeting",
                    "Creative & media", "Knowledge work", "Dev workflows"];
const CAT_ICONS = {"Personal apps": "🏠", "Life admin": "🗂️", "Money & budgeting": "💸",
                   "Creative & media": "🎬", "Knowledge work": "🧠", "Dev workflows": "⚙️"};
const BADGES = {creative: "🎨 creative", useful: "✅ useful", fun: "🎉 fun",
                painPoint: "🩹 pain point", money: "💰 saves money"};
const ICONS = {creative: "🎨", useful: "✅", fun: "🎉", painPoint: "🩹", money: "💰"};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SPINES = ["#5e2a22", "#3e4a2c", "#27364a", "#4a2c44", "#5a4020", "#2f4a44",
                "#59331c", "#403050"];

let all = [], notes = [], filter = "all", query = "", openMonth = null, drawerSort = "score";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const matches = u => {
  if (filter !== "all" && !u.criteria[filter]) return false;
  const q = query.trim().toLowerCase();
  return !q || [u.title, u.summary, u.example || "", u.category, u.recipe?.how || ""]
    .join(" ").toLowerCase().includes(q);
};
const month = u => parseInt(u.added.slice(5, 7), 10) - 1;
const latestWeek = () => all.length ? all.map(u => u.week).sort().at(-1) : "";

function renderShelves() {
  const sparkles = Array.from({length: 8}, (_, i) =>
    `<span class="sparkle" style="left:${6 + i * 12}%;top:${8 + (i * 31) % 74}%;animation-delay:${(i * .7).toFixed(1)}s">✦</span>`).join("");
  const latest = latestWeek();
  const alcoves = CATEGORIES.map(cat => {
    const items = all.filter(u => u.category === cat && matches(u));
    const tomes = items.map(u => {
      const hs = hash(u.id);
      const color = SPINES[hs % SPINES.length];
      const h = 34 + u.score * 3;
      const w = 78 + hs % 20;
      const rot = ((hs >> 2) % 3 - 1) * 0.7;
      const off = (hs >> 4) % 14;
      const icons = Object.keys(ICONS).filter(k => u.criteria[k]).map(k => ICONS[k]).join("");
      return `<button class="tome${u.criteria.money ? " gilded" : ""}${u.week === latest ? " fresh" : ""}" data-id="${esc(u.id)}" title="${esc(u.title)}"
        style="height:${h}px;width:${w}%;margin-left:${off}px;transform:rotate(${rot}deg);
        background:linear-gradient(180deg, rgba(255,255,255,.16), rgba(0,0,0,.3)), ${color}">
        <span class="ttitle">${esc(u.title)}</span><span class="ticons">${icons}</span>
      </button>`;
    }).join("");
    return `<div class="alcove"><div class="plaque">${CAT_ICONS[cat]} ${esc(cat)} · ${items.length}</div>
      <div class="stack">${tomes || '<div class="empty-stack">🕸️ no spells discovered yet</div>'}</div>
      <div class="shelf-lip"></div></div>`;
  }).join("");
  document.getElementById("bookcase").innerHTML =
    `<div class="case-title">🕯️ the restricted section — every spellbook opens at a touch 🕯️</div>${sparkles}<div class="alcoves">${alcoves}</div>`;
}

function cardHTML(u) {
  const badges = Object.keys(BADGES).filter(k => u.criteria[k])
    .map(k => `<span class="badge">${BADGES[k]}</span>`).join("");
  const sources = u.sources.map(s =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(" · ");
  return `<div class="card"><h3>${esc(u.title)}</h3><p>${esc(u.summary)}</p>
    <div class="badges">${badges}</div>
    <div class="meta">score ${u.score} · ${esc(u.category)} · 📜 ${esc(u.recipe?.difficulty || "?")} · ${esc(u.week)} · ${sources}</div></div>`;
}

function renderDrawers() {
  document.getElementById("drawers").innerHTML = MONTHS.map((m, i) => {
    const n = all.filter(u => month(u) === i && matches(u)).length;
    return `<button class="drawer${openMonth === i ? " open" : ""}" data-month="${i}"
      ${n === 0 ? "disabled" : ""} aria-expanded="${openMonth === i}">
      ${m}<span class="count">${n} ${n === 1 ? "spell" : "spells"}</span><span class="handle"></span>
    </button>`;
  }).join("");

  const slot = document.getElementById("panelSlot");
  if (openMonth === null) { slot.innerHTML = ""; return; }
  let items = all.filter(u => month(u) === openMonth && matches(u));
  items.sort((a, b) => drawerSort === "score"
    ? b.score - a.score || a.title.localeCompare(b.title)
    : b.added.localeCompare(a.added) || b.score - a.score);
  const monthKey = `2026-${String(openMonth + 1).padStart(2, "0")}`;
  const note = notes.find(n => n.month === monthKey);
  slot.innerHTML = `<div class="drawer-panel">
    <div class="panel-head"><strong>🗄️ ${MONTHS[openMonth]} 2026 — ${items.length} spell${items.length === 1 ? "" : "s"} discovered</strong>
      <select id="drawerSort">
        <option value="score"${drawerSort === "score" ? " selected" : ""}>Sort: score</option>
        <option value="newest"${drawerSort === "newest" ? " selected" : ""}>Sort: newest</option>
      </select></div>
    ${note ? `<div class="libnote">🪶 Librarian's note — ${esc(note.text)}</div>` : ""}
    ${items.length ? items.map(cardHTML).join("") : '<div class="empty">Nothing in this drawer matches the filter.</div>'}
  </div>`;
  document.getElementById("drawerSort").addEventListener("change", e => {
    drawerSort = e.target.value; renderDrawers();
  });
}

function openBook(u) {
  const badges = Object.keys(BADGES).filter(k => u.criteria[k])
    .map(k => `<span class="badge">${BADGES[k]}</span>`).join("");
  const sources = u.sources.map(s =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(" · ");
  document.getElementById("modal").innerHTML = `<div class="modal-top">
    <button class="xbtn" aria-label="Close">✕</button>
    <h3>${esc(u.title)}</h3>
    <div class="cat">${CAT_ICONS[u.category]} ${esc(u.category)} · score ${u.score} · added ${esc(u.added)} (${esc(u.week)})</div>
    <p>${esc(u.summary)}</p>
    ${u.example ? `<div class="example">e.g. ${esc(u.example)}</div>` : ""}
    ${u.recipe ? `<div class="recipe"><div class="rhead">📜 How to cast it<span class="diff">${esc(u.recipe.difficulty)}</span></div>
      <p>${esc(u.recipe.how)}</p>
      <div class="rtools">🧰 ${u.recipe.tools.map(esc).join(" · ")}</div></div>` : ""}
    <div class="badges">${badges}</div>
    <div class="meta">${sources}</div></div>`;
  document.getElementById("overlay").classList.add("show");
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }

function openAbout() {
  document.getElementById("modal").innerHTML = `<div class="modal-top about">
    <button class="xbtn" aria-label="Close">✕</button>
    <h3>📜 Read me first</h3>
    <p>This is an archive of <b>personal & productivity things people do with
    Claude Code</b> — each one shelved as a spellbook, each with a recipe so
    you can cast it yourself. Nothing here needs a startup, a budget, or a
    team: every spell is castable by one person in an evening or a weekend.</p>
    <h4>How to browse</h4>
    <ul>
      <li><b>Click any tome</b> to open it: what it does, a real example, and
      the 📜 recipe (how, tools, time needed).</li>
      <li><b>Pull open a month drawer</b> below to see what was discovered
      that month, plus the librarian's month-end note.</li>
      <li><b>Filter or search</b> with the chips and search box up top —
      they work on shelves and drawers alike.</li>
      <li><b>Glowing books</b> are this week's new arrivals. Gilt-edged ones
      💰 save you money. Thicker spines scored higher.</li>
    </ul>
    <h4>Where the spells come from</h4>
    <p>Every Monday an AI librarian researches the week's discoveries across
    the web, keeps only what's genuinely new and worth casting, and shelves
    it here — scored on five criteria: 🎨 creative, ✅ useful, 🎉 fun,
    🩹 solves a pain point, 💰 saves money. The week's top 5 arrive by owl
    (Telegram).</p>
    <p><i>The goal: by December, twelve drawers of small, castable magic.</i></p>
  </div>`;
  document.getElementById("overlay").classList.add("show");
}
document.getElementById("aboutLink").addEventListener("click", e => {
  e.preventDefault(); openAbout();
});

document.getElementById("search").addEventListener("input", e => {
  query = e.target.value; renderShelves(); renderDrawers();
});
document.getElementById("chips").addEventListener("click", e => {
  if (!e.target.dataset.key) return;
  filter = e.target.dataset.key;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === e.target));
  renderShelves(); renderDrawers();
});
document.getElementById("bookcase").addEventListener("click", e => {
  const b = e.target.closest(".tome");
  if (b) openBook(all.find(u => u.id === b.dataset.id));
});
document.getElementById("drawers").addEventListener("click", e => {
  const d = e.target.closest(".drawer");
  if (!d || d.disabled) return;
  const m = parseInt(d.dataset.month, 10);
  openMonth = openMonth === m ? null : m;
  renderDrawers();
});
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay" || e.target.classList.contains("xbtn")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

fetch("data/usecases.json").then(r => r.json()).then(doc => {
  all = doc.usecases;
  notes = doc.librarianNotes || [];
  document.getElementById("sub").textContent =
    `${all.length} spells bound so far · updated ${doc.updated} · the weekly top 5 arrives by owl (Telegram)`;
  renderShelves(); renderDrawers();
}).catch(() => {
  document.getElementById("sub").textContent =
    "Could not load data/usecases.json — serve this folder with: python3 -m http.server 8124";
});
</script>
</body>
</html>
